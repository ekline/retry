[package]
name = "retry"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A pure, sans-I/O retransmission backoff calculator (RFC 9915 section 15 shaped), generic over protocol."
license = "MIT"
repository = "https://github.com/ekline/retry"
readme = "../README.md"
keywords = ["backoff", "retry", "retransmission"]
categories = ["algorithms", "no-std"]

[features]
default = []
# Enables UniformJitter, a JitterSource backed by any rand_core::RngCore.
rand = ["dep:rand_core"]

[dependencies]
rand_core = { version = "0.6.4", optional = true, default-features = false }

[dev-dependencies]
# Used only by tests/conformance.rs to parse the shared testvectors/*.json
# files. Dev-dependencies are not part of the published crate's dependency
# graph, so this does not affect SPEC.md's "zero dependencies in default
# build" requirement for library consumers.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
