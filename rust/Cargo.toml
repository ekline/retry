[package]
name = "libretry"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A pure, sans-I/O retransmission backoff calculator (RFC 9915 section 15 shaped), generic over protocol."
license = "MIT"
homepage = "https://github.com/ekline/libretry"
repository = "https://github.com/ekline/libretry"
readme = "../README.md"
keywords = ["backoff", "retry", "retransmission"]
categories = ["algorithms", "no-std"]

[[bin]]
name = "retry"
path = "src/main.rs"
# Keeps the library's default build (and any downstream `libretry = "0.1"`
# library-only consumer) free of the CLI's dependencies: this target,
# and clap below, are only pulled in when --features cli is requested.
required-features = ["cli"]

[features]
default = []
# Enables UniformJitter, a JitterSource backed by any rand_core::RngCore.
rand = ["dep:rand_core"]
# Enables the `retry` CLI binary (src/main.rs), a small `seq`-like tool
# for manually inspecting a Params configuration. See SPEC.md §13.
cli = ["dep:clap"]

[dependencies]
rand_core = { version = "0.6.4", optional = true, default-features = false }
clap = { version = "4", optional = true, features = ["derive"] }

[dev-dependencies]
# Used only by tests/conformance.rs to parse the shared testvectors/*.json
# files. Dev-dependencies are not part of the published crate's dependency
# graph, so this does not affect SPEC.md's "zero dependencies in default
# build" requirement for library consumers.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Property-based tests for `compute` (tests/properties.rs).
proptest = "1"
